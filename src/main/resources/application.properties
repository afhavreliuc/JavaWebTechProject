spring.application.name=management

# H2 Database (Primary) - Ideal for development on Mac
spring.datasource.jdbc-url=jdbc:h2:mem:medical;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# DW Database (Data Warehouse) - Also using H2
spring.dw-datasource.jdbc-url=jdbc:h2:mem:medicaldw;DB_CLOSE_DELAY=-1
spring.dw-datasource.driver-class-name=org.h2.Driver
spring.dw-datasource.username=sa
spring.dw-datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
