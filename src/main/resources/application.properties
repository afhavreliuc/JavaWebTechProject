spring.application.name=management
spring.datasource.jdbc-url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=system
spring.datasource.password=oracle 
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true

spring.dw-datasource.jdbc-url=jdbc:h2:mem:dwdb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.dw-datasource.username=sa
spring.dw-datasource.password=
spring.dw-datasource.driver-class-name=org.h2.Driver
